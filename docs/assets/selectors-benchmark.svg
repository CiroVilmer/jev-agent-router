<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404" role="img" aria-labelledby="titulo desc">
<title id="titulo">Classifier benchmark: rules, Haiku 5.5 and Jev</title>
<desc id="desc">On 729 real subagents (2026-10-16). Accuracy on its own, within the 1 second budget: Jev 83.8%, Haiku 5.5 72.8% (87.8% without the budget), rules only 16.0%. Median latency: Jev 245 ms (p95 307 ms), Haiku 5.5 825 ms (p95 2.16 s), rules instant. </desc>
<style>
  svg { color-scheme: light dark; }
  .card { fill: #fcfcfb; stroke: #e4e3df; }
  .t-title { font: 600 20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0b0b0b; }
  .t-subtitle { font: 400 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #52514e; }
  .t-panel { font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0b0b0b; }
  .t-sub, .t-tick, .t-note, .t-foot { font: 400 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #6b6a66; }
  .t-row { font: 500 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0b0b0b; }
  .t-val { font: 600 12.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0b0b0b; font-variant-numeric: tabular-nums; }
  .t-in { fill: #ffffff; }
  .t-halo { paint-order: stroke; stroke: #fcfcfb; stroke-width: 4px; stroke-linejoin: round; }
  .t-budget { font: 600 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #52514e; }
  .grid { stroke: #ecebe7; stroke-width: 1; }
  .axis { stroke: #c9c8c2; stroke-width: 1; }
  .budget { stroke: #52514e; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .gap { fill: #fcfcfb; }
  .whisker { stroke-width: 2; stroke-linecap: round; }
  .s-jev { fill: #2a78d6; stroke: #2a78d6; }
  .s-haiku { fill: #eb6834; stroke: #eb6834; }
  .s-reglas { fill: #1baf7a; stroke: #1baf7a; }
  .bar, .sw, .ghost { stroke: none; }
  .ghost { fill-opacity: 0.28; }
  @media (prefers-color-scheme: dark) {
    .card { fill: #161b22; stroke: #30363d; }
    .t-title, .t-panel, .t-row, .t-val { fill: #f0efec; }
    .t-in { fill: #0b0b0b; }
    .t-halo { stroke: #161b22; }
    .t-subtitle, .t-budget { fill: #c3c2b7; }
    .t-sub, .t-tick, .t-note, .t-foot { fill: #9d9c95; }
    .grid { stroke: #262c33; }
    .axis { stroke: #3d444d; }
    .budget { stroke: #c3c2b7; }
    .gap { fill: #161b22; }
    .s-jev { fill: #3987e5; stroke: #3987e5; }
    .s-haiku { fill: #d95926; stroke: #d95926; }
    .s-reglas { fill: #199e70; stroke: #199e70; }
    .ghost { fill-opacity: 0.35; }
    .bar, .sw, .ghost { stroke: none; }
  }
</style>
<rect class="card" x="0.5" y="0.5" width="879" height="403" rx="12"/>
<text class="t-title" x="24" y="40">Which classifier should decide?</text>
<text class="t-subtitle" x="24" y="62">729 real subagents from the bench · one call at a time · 2026-10-16</text>
<rect class="sw s-jev" x="24" y="140" width="10" height="10" rx="2"/><text class="t-row" x="40" y="149">Jev</text><rect class="sw s-haiku" x="24" y="198" width="10" height="10" rx="2"/><text class="t-row" x="40" y="207">Haiku 5.5</text><rect class="sw s-reglas" x="24" y="256" width="10" height="10" rx="2"/><text class="t-row" x="40" y="265">Rules only</text><text class="t-panel" x="136" y="96">Accuracy on its own</text><text class="t-sub" x="136" y="114">9 task types · within the 1 s budget</text><line class="grid" x1="136" x2="136" y1="126" y2="288"/><text class="t-tick" x="136" y="304" text-anchor="middle">0%</text><line class="grid" x1="208.5" x2="208.5" y1="126" y2="288"/><text class="t-tick" x="208.5" y="304" text-anchor="middle">25%</text><line class="grid" x1="281" x2="281" y1="126" y2="288"/><text class="t-tick" x="281" y="304" text-anchor="middle">50%</text><line class="grid" x1="353.5" x2="353.5" y1="126" y2="288"/><text class="t-tick" x="353.5" y="304" text-anchor="middle">75%</text><line class="grid" x1="426" x2="426" y1="126" y2="288"/><text class="t-tick" x="426" y="304" text-anchor="middle">100%</text><line class="axis" x1="136" x2="136" y1="126" y2="288"/><path class="bar s-jev"  d="M136,132H375.02Q379.02,132 379.02,136V154Q379.02,158 375.02,158H136Z"/><text class="t-val" x="385.02" y="149">83.8%</text><path class="ghost s-haiku"  d="M136,190H386.62Q390.62,190 390.62,194V212Q390.62,216 386.62,216H136Z"/><path class="bar s-haiku"  d="M136,190H343.12Q347.12,190 347.12,194V212Q347.12,216 343.12,216H136Z"/><rect class="gap" x="346.12" y="190" width="2" height="26"/><text class="t-val t-in" x="339.12" y="207" text-anchor="end">72.8%</text><text class="t-note" x="136" y="229">87.8% without the budget</text><path class="bar s-reglas"  d="M136,248H178.4Q182.4,248 182.4,252V270Q182.4,274 178.4,274H136Z"/><text class="t-val" x="188.4" y="265">16.0%</text><text class="t-note" x="136" y="287">no model: always build-small</text><text class="t-panel" x="494" y="96">Latency per call</text><text class="t-sub" x="494" y="114">bar: median · whisker: p95</text><line class="grid" x1="494" x2="494" y1="126" y2="288"/><text class="t-tick" x="494" y="304" text-anchor="middle">0</text><line class="grid" x1="610" x2="610" y1="126" y2="288"/><text class="t-tick" x="610" y="304" text-anchor="middle">1 s</text><line class="grid" x1="726" x2="726" y1="126" y2="288"/><text class="t-tick" x="726" y="304" text-anchor="middle">2 s</text><line class="axis" x1="494" x2="494" y1="126" y2="288"/><line class="budget" x1="610" x2="610" y1="122" y2="288"/><text class="t-budget" x="610" y="319" text-anchor="middle">budget</text><path class="bar s-jev"  d="M494,132H518.42Q522.42,132 522.42,136V154Q522.42,158 518.42,158H494Z"/><line class="whisker s-jev" x1="522.42" x2="529.612" y1="145" y2="145"/><line class="whisker s-jev" x1="529.612" x2="529.612" y1="138" y2="152"/><text class="t-val t-halo" x="535.612" y="149">245 ms · p95 307 ms</text><path class="bar s-haiku"  d="M494,190H585.7Q589.7,190 589.7,194V212Q589.7,216 585.7,216H494Z"/><line class="whisker s-haiku" x1="589.7" x2="744.212" y1="203" y2="203"/><line class="whisker s-haiku" x1="744.212" x2="744.212" y1="196" y2="210"/><text class="t-val t-halo" x="494" y="230">825 ms · p95 2.16 s</text><text class="t-val" x="500" y="265">instant</text>
<text class="t-foot" x="24" y="358">Cost per 1,000 calls: Jev ≈ $0.017 + output (price not published) · Haiku 5.5 ≈ $0.24 at API list price (uses quota on Claude Max) · rules $0.</text>
<text class="t-foot" x="24" y="380">Only Jev returns a calibrated confidence: at 0.9 or more it is right 95% of the time.</text>
</svg>
