9.76" y="265">16.0%</text><text class="t-note" x="136" y="287">no model: always build-small</text><text class="t-panel" x="420" y="96">Latency per call</text><text class="t-sub" x="420" y="114">bar: median · whisker: p95</text><line class="grid" x1="420" x2="420" y1="126" y2="288"/><text class="t-tick" x="420" y="304" text-anchor="middle">0</text><line class="grid" x1="514.4" x2="514.4" y1="126" y2="288"/><text class="t-tick" x="514.4" y="304" text-anchor="middle">1 s</text><line class="grid" x1="608.8" x2="608.8" y1="126" y2="288"/><text class="t-tick" x="608.8" y="304" text-anchor="middle">2 s</text><line class="axis" x1="420" x2="420" y1="126" y2="288"/><line class="budget" x1="514.4" x2="514.4" y1="122" y2="288"/><text class="t-budget" x="514.4" y="319" text-anchor="middle">budget</text><path class="bar s-jev"  d="M420,132H439.128Q443.128,132 443.128,136V154Q443.128,158 439.128,158H420Z"/><line class="whisker s-jev" x1="443.128" x2="448.9808" y1="145" y2="145"/><line class="whisker s-jev" x1="448.9808" x2="448.9808" y1="138" y2="152"/><text class="t-val t-halo" x="454.9808" y="149">245 ms · p95 307 ms</text><path class="bar s-haiku"  d="M420,190H493.88Q497.88,190 497.88,194V212Q497.88,216 493.88,216H420Z"/><line class="whisker s-haiku" x1="497.88" x2="623.6208" y1="203" y2="203"/><line class="whisker s-haiku" x1="623.6208" x2="623.6208" y1="196" y2="210"/><text class="t-val t-halo" x="420" y="230">825 ms · p95 2.16 s</text><text class="t-val" x="426" y="265">instant</text><text class="t-panel" x="704" y="96">Full routing policy</text><text class="t-sub" x="704" y="114">rules first · within the 1 s budget</text><line class="grid" x1="704" x2="704" y1="126" y2="288"/><text class="t-tick" x="704" y="304" text-anchor="middle">0%</text><line class="grid" x1="763" x2="763" y1="126" y2="288"/><text class="t-tick" x="763" y="304" text-anchor="middle">25%</text><line class="grid" x1="822" x2="822" y1="126" y2="288"/><text class="t-tick" x="822" y="304" text-anchor="middle">50%</text><line class="grid" x1="881" x2="881" y1="126" y2="288"/><text class="t-tick" x="881" y="304" text-anchor="middle">75%</text><line class="grid" x1="940" x2="940" y1="126" y2="288"/><text class="t-tick" x="940" y="304" text-anchor="middle">100%</text><line class="axis" x1="704" x2="704" y1="126" y2="288"/><path class="bar s-jev"  d="M704,132H914.288Q918.288,132 918.288,136V154Q918.288,158 914.288,158H704Z"/><text class="t-val t-in" x="910.288" y="149" text-anchor="end">90.8%</text><path class="bar s-haiku"  d="M704,190H914.288Q918.288,190 918.288,194V212Q918.288,216 914.288,216H704Z"/><text class="t-val t-in" x="910.288" y="207" text-anchor="end">90.8%</text><path class="bar s-reglas"  d="M704,248H912.4Q916.4,248 916.4,252V270Q916.4,274 912.4,274H704Z"/><text class="t-val t-in" x="908.4" y="265" text-anchor="end">90.0%</text>
<text class="t-foot" x="24" y="358">Cost per 1,000 calls: Jev ≈ $0.017 + output (price not published) · Haiku 5.5 ≈ $0.24 at API list price (uses quota on Claude Max) · rules $0.</text>
<text class="t-foot" x="24" y="380">The rules decide most subagents on their own, so every classifier ends near 90%: what changes is speed, calibration and cost.</text>
</svg>
