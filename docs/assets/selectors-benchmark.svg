<svg xmlns="http://www.w3.org/2000/svg" width="960" height="404" viewBox="0 0 960 404" role="img" aria-labelledby="titulo desc">
<title id="titulo">Classifier benchmark: rules, Haiku 5.5 and Jev</title>
<desc id="desc">On 729 real subagents (2026-10-16). Accuracy on its own, within the 1 second budget: Jev 83.8%, Haiku 5.5 72.8% (87.8% without the budget), rules only 16.0%. Median latency: Jev 245 ms (p95 307 ms), Haiku 5.5 825 ms (p95 2.16 s), rules instant. Full routing policy within the budget: Jev 90.8%, Haiku 5.5 90.8%, rules only 90.0%.</desc>
<style>
  svg { color-scheme: light dark; }
  .card { fill: #fcfcfb; stroke: #e4e3df; }
  .t-title { font: 600 20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0b0b0b; }
  .t-subtitle { font: 400 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #52514e; }
  .t-panel { font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0b0b0b; }
  .t-sub, .t-tick, .t-note, .t-foot { font: 400 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #6b6a66; }
  .t-row { font: 500 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0b0b0b; }
  .t-val { font: 600 12.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0b0b0b; font-variant-numeric: tabular-nums; }
  .t-in { fill: #ffffff; }
  .t-halo { paint-order: stroke; stroke: #fcfcfb; stroke-width: 4px; stroke-linejoin: round; }
  .t-budget { font: 600 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #52514e; }
  .grid { stroke: #ecebe7; stroke-width: 1; }
  .axis { stroke: #c9c8c2; stroke-width: 1; }
  .budget { stroke: #52514e; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .gap { fill: #fcfcfb; }
  .whisker { stroke-width: 2; stroke-linecap: round; }
  .s-jev { fill: #2a78d6; stroke: #2a78d6; }
  .s-haiku { fill: #eb6834; stroke: #eb6834; }
  .s-reglas { fill: #1baf7a; stroke: #1baf7a; }
  .bar, .sw, .ghost { stroke: none; }
  .ghost { fill-opacity: 0.28; }
  @media (prefers-color-scheme: dark) {
    .card { fill: #161b22; stroke: #30363d; }
    .t-title, .t-panel, .t-row, .t-val { fill: #f0efec; }
    .t-in { fill: #0b0b0b; }
    .t-halo { stroke: #161b22; }
    .t-subtitle, .t-budget { fill: #c3c2b7; }
    .t-sub, .t-tick, .t-note, .t-foot { fill: #9d9c95; }
    .grid { stroke: #262c33; }
    .axis { stroke: #3d444d; }
    .budget { stroke: #c3c2b7; }
    .gap { fill: #161b22; }
    .s-jev { fill: #3987e5; stroke: #3987e5; }
    .s-haiku { fill: #d95926; stroke: #d95926; }
    .s-reglas { fill: #199e70; stroke: #199e70; }
    .ghost { fill-opacity: 0.35; }
    .bar, .sw, .ghost { stroke: none; }
  }
</style>
